<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Error report | KAPDA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width: 720px;"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
    {% if sent %}<h1 class="h3">Error reported</h1><p class="text-muted">The complete technical details have been sent to the system administrator. Thank you.</p>
    {% else %}<h1 class="h3">Report not sent</h1><div class="alert alert-warning">{{ error }}</div>{% endif %}
    <a class="btn btn-primary" href="/">Return to KAPDA</a>
</div></div></main></body></html>
