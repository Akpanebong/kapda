<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | KAPDA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <p class="text-uppercase text-muted small fw-semibold mb-2">KAPDA Digital Programme System</p>
            <h1 class="h3 mb-3">Something went wrong</h1>
            <p class="text-muted">The application could not complete that request. The main error was:</p>
            <div class="alert alert-danger" role="alert">{{ error_message|default:"An unexpected server error occurred." }}</div>
            <p class="small text-muted">You can send the technical details to the system administrator with one click.</p>
            <form method="post" action="{% url 'errors:report' %}">
                {% csrf_token %}
                <input type="hidden" name="report_id" value="{{ report_id }}">
                <button class="btn btn-primary" type="submit">Report error</button>
                <button class="btn btn-link" type="button" onclick="history.back()">Go back</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
